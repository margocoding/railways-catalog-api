name: Ops server access

# Служебная проверка доступа выкатки к серверу (ключ сменён 14.09.2026).
# Запускается только пушем в ветку ops/server-access, main и выкатку не трогает.
# Ничего на сервере не меняет; лог публичный — секреты и настройки не печатаются.

on:
  push:
    branches:
      - ops/server-access

permissions:
  contents: read

jobs:
  check:
    name: Check deploy key
    runs-on: ubuntu-latest

    steps:
      - name: Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose ps --services > /dev/null
            echo "deploy access ok"
